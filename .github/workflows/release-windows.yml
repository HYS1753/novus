name: Windows signed release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate repository, source, main ancestry and version tag
        id: guard
        run: node scripts/ci-release.mjs guard
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Frontend production build
        run: pnpm build
      - name: Release and signature regression tests
        run: pnpm release:test
      - name: Native dependency integrity regression tests
        run: python -m unittest discover -s scripts -p "*_test.py"
      - name: Stage pinned MPV and verify archive and DLL hashes
        run: python scripts/setup_mpv.py --target windows --force
      - name: Build and sign Windows x64 NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY secret' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret' }
          pnpm release:build:windows
      - name: Verify signatures and prepare manifest and source metadata
        run: pnpm release:ci prepare
      - name: Preserve verified release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/release-assets/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tauri/target/release-assets
      - name: Reverify downloaded installer, manifest, hashes and provenance
        run: node scripts/ci-release.mjs verify src-tauri/target/release-assets
      - name: Create draft release without replacing existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/novus-release-tags.txt"
          if grep -Fxq -- "$RELEASE_TAG" "$RUNNER_TEMP/novus-release-tags.txt"; then
            echo "Release already exists; refusing to replace this version." >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]; then
            echo "Remote tag moved after the build; refusing release creation." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --draft --title "Novus $RELEASE_TAG" \
            --notes "Windows x64 NSIS. Source: $GITHUB_SHA. Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Draft pending installation and updater validation." \
            src-tauri/target/release-assets/*
